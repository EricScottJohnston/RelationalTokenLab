[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relational-reasoner"
version = "0.1.0"
description = "LLM-free persistent recursive relational reasoner with lexical RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
relreason = "relational_reasoner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["relational_reasoner*"]
